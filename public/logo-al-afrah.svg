<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 660" fill="none">
  <defs>
    <linearGradient id="goldGrad" gradientUnits="userSpaceOnUse" x1="60" y1="60" x2="440" y2="600">
      <stop offset="0%" stop-color="#F9E8B0"/>
      <stop offset="45%" stop-color="#D9A521"/>
      <stop offset="100%" stop-color="#8B6A14"/>
    </linearGradient>
  </defs>

  <!-- crown: overlapping circle fan -->
  <circle cx="165" cy="215" r="45" stroke="url(#goldGrad)" stroke-width="4.5"/>
  <circle cx="335" cy="215" r="45" stroke="url(#goldGrad)" stroke-width="4.5"/>
  <circle cx="205" cy="188" r="62" stroke="url(#goldGrad)" stroke-width="4.5"/>
  <circle cx="295" cy="188" r="62" stroke="url(#goldGrad)" stroke-width="4.5"/>
  <circle cx="250" cy="172" r="78" stroke="url(#goldGrad)" stroke-width="4.5"/>

  <!-- pediment triangle -->
  <path d="M170,292 L250,140 L330,292" stroke="url(#goldGrad)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- flourish scrolls at the base of the pediment -->
  <path d="M170,292 C 143,297 132,317 145,335 C 155,349 176,349 184,336" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M330,292 C 357,297 368,317 355,335 C 345,349 324,349 316,336" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- AL monogram roundel -->
  <circle cx="250" cy="207" r="40" stroke="url(#goldGrad)" stroke-width="4"/>
  <text x="250" y="221" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="36" font-weight="600" letter-spacing="1" fill="url(#goldGrad)">AL</text>

  <!-- top rule -->
  <line x1="88" y1="308" x2="412" y2="308" stroke="url(#goldGrad)" stroke-width="6"/>

  <!-- wordmark -->
  <text x="250" y="410" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="108" font-weight="600" letter-spacing="6" fill="url(#goldGrad)">AFRAH</text>

  <!-- bottom rule -->
  <line x1="88" y1="440" x2="412" y2="440" stroke="url(#goldGrad)" stroke-width="6"/>

  <!-- LIMITED subtitle -->
  <text x="250" y="478" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="27" letter-spacing="15" fill="url(#goldGrad)">LIMITED</text>

  <!-- lower arch / lattice pendant -->
  <path d="M170,500 C170,560 215,600 250,632" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M330,500 C330,560 285,600 250,632" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M170,500 L250,632" stroke="url(#goldGrad)" stroke-width="2"/>
  <path d="M330,500 L250,632" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- diamond lattice accents -->
  <rect x="228" y="524" width="34" height="34" transform="rotate(45 245 541)" stroke="url(#goldGrad)" stroke-width="2"/>
  <rect x="198" y="546" width="26" height="26" transform="rotate(45 211 559)" stroke="url(#goldGrad)" stroke-width="1.6"/>
  <rect x="276" y="546" width="26" height="26" transform="rotate(45 289 559)" stroke="url(#goldGrad)" stroke-width="1.6"/>

  <!-- pendant tip -->
  <path d="M244,632 C 232,646 232,660 250,668 C 268,660 268,646 256,632" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
</svg>
